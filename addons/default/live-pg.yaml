apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    app.kubernetes.io/name: live-pg
    app.kubernetes.io/managed-by: kubepilot
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: live-pg-data
  namespace: default
  labels:
    app.kubernetes.io/name: live-pg
    app.kubernetes.io/managed-by: kubepilot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-pg
  namespace: default
  labels:
    app.kubernetes.io/name: live-pg
    app.kubernetes.io/managed-by: kubepilot
    app.kubernetes.io/component: postgres
  annotations:
    kubepilot.io/addon-kind: postgres
    kubepilot.io/postgres-database: app
    kubepilot.io/postgres-username: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: live-pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: live-pg
        app.kubernetes.io/managed-by: kubepilot
    spec:
      containers:
        - name: live-pg
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: live-pg-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: live-pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: live-pg
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: live-pg
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
# Secret credentials stay in Control Plane Intent, not the Recipe.
# Applied Secret name: live-pg-credentials
