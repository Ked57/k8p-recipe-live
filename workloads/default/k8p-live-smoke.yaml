apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    app.kubernetes.io/name: k8p-live-smoke
    app.kubernetes.io/managed-by: kubepilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8p-live-smoke
  namespace: default
  labels:
    app.kubernetes.io/name: k8p-live-smoke
    app.kubernetes.io/managed-by: kubepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8p-live-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8p-live-smoke
        app.kubernetes.io/managed-by: kubepilot
    spec:
      containers:
        - name: k8p-live-smoke
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: k8p-live-smoke
  namespace: default
  labels:
    app.kubernetes.io/name: k8p-live-smoke
    app.kubernetes.io/managed-by: kubepilot
spec:
  selector:
    app.kubernetes.io/name: k8p-live-smoke
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
