apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    app.kubernetes.io/name: whoami-web
    app.kubernetes.io/managed-by: kubepilot
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-web
  namespace: default
  labels:
    app.kubernetes.io/name: whoami-web
    app.kubernetes.io/managed-by: kubepilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: whoami-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: whoami-web
        app.kubernetes.io/managed-by: kubepilot
    spec:
      containers:
        - name: whoami-web
          image: traefik/whoami:v1.10
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-web
  namespace: default
  labels:
    app.kubernetes.io/name: whoami-web
    app.kubernetes.io/managed-by: kubepilot
spec:
  selector:
    app.kubernetes.io/name: whoami-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
